# Install as .github/actions/docs/action.yml in Psience.
name: Build Psience documentation
description: Generate documentation from the checked-out revision without publishing it
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install McUtils and Psience
      shell: bash
      # Preserve the existing docs build's use of McUtils from GitHub.
      run: python -m pip install "git+https://github.com/McCoyGroup/McUtils.git@master" .
    - name: Generate documentation
      shell: bash
      run: python ci/build_docs.py
