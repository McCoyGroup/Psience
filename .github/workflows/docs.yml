# Install as .github/workflows/docs.yml in Psience.
# One-time repository setup:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#   Settings > Environments > github-pages: allow deployments from master
name: PsienceDocs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual runs on other branches must not publish the production site.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check Pages publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! build_type=$(gh api --method GET "repos/${GH_REPO}/pages" --jq '.build_type'); then
            echo "::error::Could not read Pages settings. Enable Pages with Source set to GitHub Actions, and ensure this job has pages: read permission."
            exit 1
          fi
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::Pages is configured to publish from a branch. Open Settings > Pages > Build and deployment and set Source to GitHub Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setup.py derives the package version from Git tags.
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Generate documentation
        uses: ./.github/actions/docs

      - name: Build HTML with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./ci/docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
